services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading}
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
  backend:
    build: ./backend/trading-core
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trading}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-trading}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:-}
      ATLAS_VAULT_MASTER_KEY: ${ATLAS_VAULT_MASTER_KEY:-}
      ATLAS_VAULT_PREVIOUS_KEY: ${ATLAS_VAULT_PREVIOUS_KEY:-}
      ATLAS_VAULT_KEY_VERSION: ${ATLAS_VAULT_KEY_VERSION:-1}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      ATLAS_SESSION_TTL_SECONDS: ${ATLAS_SESSION_TTL_SECONDS:-604800}
      ATLAS_AI_PROXY_ENABLED: ${ATLAS_AI_PROXY_ENABLED:-false}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      ATLAS_MARKET_FEEDS_ENABLED: ${ATLAS_MARKET_FEEDS_ENABLED:-true}
      ATLAS_PORTFOLIO_AUTO_REFRESH_ENABLED: ${ATLAS_PORTFOLIO_AUTO_REFRESH_ENABLED:-true}
    ports: ["127.0.0.1:${SPRING_PORT:-8080}:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
  intelligence:
    build: ./intelligence
    environment:
      ATLAS_BACKEND_URL: http://backend:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      ATLAS_AI_PROVIDER_ORDER: ${ATLAS_AI_PROVIDER_ORDER:-OLLAMA,GEMINI,GROQ,OPENAI,XAI}
      ATLAS_EXTERNAL_AI_ALLOWED: ${ATLAS_EXTERNAL_AI_ALLOWED:-false}
      ATLAS_PAID_AI_ALLOWED: ${ATLAS_PAID_AI_ALLOWED:-false}
      ATLAS_OLLAMA_ENABLED: ${ATLAS_OLLAMA_ENABLED:-false}
      ATLAS_OLLAMA_URL: ${ATLAS_OLLAMA_URL:-http://host.docker.internal:11434}
      ATLAS_OLLAMA_MODEL: ${ATLAS_OLLAMA_MODEL:-llama3.2}
      ATLAS_OLLAMA_RPM: ${ATLAS_OLLAMA_RPM:-120}
      ATLAS_OLLAMA_RPD: ${ATLAS_OLLAMA_RPD:-10000}
      ATLAS_GEMINI_ENABLED: ${ATLAS_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ATLAS_GEMINI_MODEL: ${ATLAS_GEMINI_MODEL:-gemini-3.5-flash-lite}
      ATLAS_GEMINI_RPM: ${ATLAS_GEMINI_RPM:-2}
      ATLAS_GEMINI_RPD: ${ATLAS_GEMINI_RPD:-30}
      ATLAS_GROQ_ENABLED: ${ATLAS_GROQ_ENABLED:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ATLAS_GROQ_MODEL: ${ATLAS_GROQ_MODEL:-llama-3.3-70b-versatile}
      ATLAS_GROQ_RPM: ${ATLAS_GROQ_RPM:-5}
      ATLAS_GROQ_RPD: ${ATLAS_GROQ_RPD:-100}
      ATLAS_OPENAI_ENABLED: ${ATLAS_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ATLAS_OPENAI_MODEL: ${ATLAS_OPENAI_MODEL:-gpt-4.1-mini}
      ATLAS_OPENAI_RPM: ${ATLAS_OPENAI_RPM:-0}
      ATLAS_OPENAI_RPD: ${ATLAS_OPENAI_RPD:-0}
      ATLAS_XAI_ENABLED: ${ATLAS_XAI_ENABLED:-false}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ATLAS_XAI_MODEL: ${ATLAS_XAI_MODEL:-grok-4.7}
      ATLAS_XAI_RPM: ${ATLAS_XAI_RPM:-0}
      ATLAS_XAI_RPD: ${ATLAS_XAI_RPD:-0}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-MANUAL_CSV}
      MARKET_DATA_AUTO_REFRESH: ${MARKET_DATA_AUTO_REFRESH:-false}
      MARKET_DATA_USAGE_RIGHTS_CONFIRMED: ${MARKET_DATA_USAGE_RIGHTS_CONFIRMED:-false}
      MARKET_DATA_ENTITLEMENT_CONFIRMED: ${MARKET_DATA_ENTITLEMENT_CONFIRMED:-false}
      MARKET_DATA_RATE_PER_SECOND: ${MARKET_DATA_RATE_PER_SECOND:-1}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      ATLAS_UPSTOX_FEED_ENABLED: ${ATLAS_UPSTOX_FEED_ENABLED:-false}
      ATLAS_UPSTOX_INSTRUMENT_KEYS: ${ATLAS_UPSTOX_INSTRUMENT_KEYS:-}
      ATLAS_UPSTOX_INSTRUMENT_IDS: ${ATLAS_UPSTOX_INSTRUMENT_IDS:-}
      ATLAS_ENTITLEMENT_MANIFEST: /app/entitlements/sources.json
      ATLAS_NAV_DB_PATH: /app/nav-data/catalog.sqlite3
      ATLAS_MF_NAV_AUTO_REFRESH_ENABLED: ${ATLAS_MF_NAV_AUTO_REFRESH_ENABLED:-true}
      ATLAS_AUTONOMOUS_RESEARCH_ENABLED: ${ATLAS_AUTONOMOUS_RESEARCH_ENABLED:-true}
      ATLAS_AUTONOMOUS_RESEARCH_INTERVAL_SECONDS: ${ATLAS_AUTONOMOUS_RESEARCH_INTERVAL_SECONDS:-900}
      ATLAS_RESEARCH_SNAPSHOT_DB: /app/ingestion-data/research_snapshots.sqlite3
      ATLAS_INGESTION_DB_PATH: /app/ingestion-data/jobs.sqlite3
      ATLAS_OHLCV_DB_PATH: /app/ingestion-data/ohlcv.sqlite3
      ATLAS_AI_BUDGET_DB_PATH: /app/ingestion-data/ai_budgets.sqlite3
      ATLAS_FLOW_DB_PATH: /app/flow-data/flows.sqlite3
      ATLAS_NEWS_DB_PATH: /app/news-data/events.sqlite3
      ATLAS_RELIABILITY_DB_PATH: /app/reliability-data/incidents.sqlite3
      ATLAS_READINESS_MONITOR_ENABLED: ${ATLAS_READINESS_MONITOR_ENABLED:-false}
      ATLAS_READINESS_MONITOR_INTERVAL_SECONDS: ${ATLAS_READINESS_MONITOR_INTERVAL_SECONDS:-900}
      ATLAS_RESEARCH_JOURNAL_FILE: /app/journal/entries.json
      ATLAS_ALERTS_FILE: /app/data/alerts.json
      ATLAS_ALERT_FEED_REGISTRY: /app/data/feeds.json
    volumes:
      - ./data/notifications:/app/data:ro
      - ./data/entitlements:/app/entitlements:ro
      - ./data/research-journal:/app/journal
      - navcatalog:/app/nav-data
      - ingestionledger:/app/ingestion-data
      - flowledger:/app/flow-data
      - newsledger:/app/news-data
      - reliabilityledger:/app/reliability-data
    ports: ["127.0.0.1:${INTELLIGENCE_PORT:-8000}:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend/trading-dashboard
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:5173"]
    depends_on: [backend, intelligence]
volumes:
  pgdata:
  redisdata:
  navcatalog:
  ingestionledger:
  flowledger:
  newsledger:
  reliabilityledger:
