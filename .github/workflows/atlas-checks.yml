name: ATLAS checks

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/trading-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/trading-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  intelligence:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  backend:
    name: Spring Boot unit and database integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/trading-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/trading-core/pom.xml
      # GitHub-hosted runners provide Docker. Testcontainers creates disposable
      # PostgreSQL instances and Flyway applies the real migration chain.
      # The cross-service HTTP test has its own job below.
      - run: mvn -B -ntp -Dtest='*Test,!AiBridgeHttpIntegrationTest' test

  deployment-contract:
    name: Compose config and Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration without real credentials
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose config --quiet
      - name: Check Python source syntax
        run: python3 -m compileall -q intelligence/app intelligence/tests scripts tests
      - name: Test production operations safeguards
        run: python3 -m unittest tests.test_p3_operations -v
      - name: Validate production Compose without real credentials
        env:
          ATLAS_IMAGE_NAMESPACE: example
          ATLAS_RELEASE_TAG: v0.0.0-ci
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: ci-placeholder-not-a-production-secret
          ATLAS_JWT_SECRET: ci-placeholder-jwt-secret-at-least-32-characters
          ATLAS_VAULT_MASTER_KEY: Y2ktcGxhY2Vob2xkZXIta2V5LW11c3QtYmUtcm90YXRlZA==
          INTERNAL_SERVICE_TOKEN: ci-placeholder-internal-token-at-least-32-chars
        run: docker compose -f docker-compose.production.yml config --quiet

  ai-bridge-integration:
    name: Real Spring-to-Python AI security integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/trading-core/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.txt
      - name: Install intelligence dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Start actual Python HTTP intelligence service
        env:
          INTERNAL_SERVICE_TOKEN: bridge-integration-secret-at-least-32-chars
          ATLAS_AI_BUDGET_DB_PATH: ${{ runner.temp }}/ai-bridge-budget.sqlite3
          ATLAS_BRIDGE_CAPTURE_FILE: ${{ runner.temp }}/ai-bridge-capture.json
          PYTHONPATH: intelligence/intelligence-tests:./intelligence/tests:./intelligence
        run: |
          python -m uvicorn bridge_probe:app --host 127.0.0.1 --port 18000 > /tmp/atlas-ai-bridge-uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/openapi.json > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Python intelligence did not start"
          exit 1
      - name: Diagnose direct Python POST parsing
        env:
          INTERNAL_SERVICE_TOKEN: bridge-integration-secret-at-least-32-chars
        run: |
          curl -sS -o /tmp/atlas-direct-response.json -w 'direct_python_status=%{http_code}\n' -X POST http://127.0.0.1:18000/api/v1/ai/analyze/TCS -H 'Content-Type: application/json' -H "X-Atlas-Service-Token: $INTERNAL_SERVICE_TOKEN" --data-binary '{"symbol":"TCS","market":"NSE"}'
          cat /tmp/atlas-direct-response.json
      - name: Verify real cross-service HTTP boundary and JWT gates
        working-directory: backend/trading-core
        env:
          ATLAS_BRIDGE_CAPTURE_FILE: ${{ runner.temp }}/ai-bridge-capture.json
        run: mvn -B -ntp -Dtest=AiBridgeHttpIntegrationTest test


  stack-http-contract:
    name: Full local stack HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: atlas-ci-contract
      ALLOW_REGISTRATION: 'true'
      ATLAS_AUTONOMOUS_RESEARCH_ENABLED: 'true'
      ATLAS_MARKET_FEEDS_ENABLED: 'false'
      ATLAS_PORTFOLIO_AUTO_REFRESH_ENABLED: 'false'
      ATLAS_MF_HISTORY_AUTO_REFRESH_ENABLED: 'false'
      ATLAS_DISCOVERY_HISTORY_ENABLED: 'false'
      ATLAS_INTRADAY_RESEARCH_ENABLED: 'false'
      ATLAS_MF_NAV_AUTO_REFRESH_ENABLED: 'false'
      ATLAS_UPSTOX_FEED_ENABLED: 'false'
      ATLAS_AUTOMATIC_AI_REVIEW_ENABLED: 'false'
      MARKET_DATA_USAGE_RIGHTS_CONFIRMED: 'false'
      MARKET_DATA_ENTITLEMENT_CONFIRMED: 'false'
      MARKET_DATA_AUTO_REFRESH: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable local credentials
        run: |
          for key in POSTGRES_PASSWORD INTERNAL_SERVICE_TOKEN; do
            value=$(openssl rand -hex 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
          for key in ATLAS_JWT_SECRET ATLAS_VAULT_MASTER_KEY; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Build and start actual local services
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Wait for frontend proxy and Python
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/intelligence/health > /dev/null && curl --fail --silent http://127.0.0.1:5173/api/v1/health > /dev/null; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Verify browser and service contracts
        run: python3 scripts/stack_contract_smoke.py --disposable-ci-stack
      - name: Report service status on failure
        if: failure()
        run: docker compose ps
      - name: Remove disposable services and volumes
        if: always()
        run: docker compose down -v --remove-orphans
