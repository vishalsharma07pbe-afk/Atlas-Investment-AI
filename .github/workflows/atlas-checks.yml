name: ATLAS checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: React build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/trading-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/trading-dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  intelligence:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  backend:
    name: Spring Boot compile and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/trading-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/trading-core/pom.xml
      # Integration tests require PostgreSQL and the project's initialized schema.
      # Compile them here; execute database integration tests in the Docker-enabled environment.
      - run: mvn -B -ntp -DskipTests package

  deployment-contract:
    name: Compose config and Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose configuration without real credentials
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
        run: docker compose config --quiet
      - name: Check Python source syntax
        run: python3 -m compileall -q intelligence/app intelligence/tests

  ai-bridge-integration:
    name: Real Spring-to-Python AI security integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/trading-core/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: intelligence/requirements.txt
      - name: Install intelligence dependencies
        run: python -m pip install -r intelligence/requirements.txt
      - name: Start actual Python HTTP intelligence service
        env:
          INTERNAL_SERVICE_TOKEN: bridge-integration-secret-at-least-32-chars
          ATLAS_AI_BUDGET_DB_PATH: ${{ runner.temp }}/ai-bridge-budget.sqlite3
          ATLAS_BRIDGE_CAPTURE_FILE: ${{ runner.temp }}/ai-bridge-capture.json
          PYTHONPATH: intelligence/intelligence-tests:./intelligence/tests:./intelligence
        run: |
          python -m uvicorn bridge_probe:app --host 127.0.0.1 --port 18000 > /tmp/atlas-ai-bridge-uvicorn.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/openapi.json > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "Python intelligence did not start"
          exit 1
      - name: Diagnose direct Python POST parsing
        env:
          INTERNAL_SERVICE_TOKEN: bridge-integration-secret-at-least-32-chars
        run: |
          curl -sS -o /tmp/atlas-direct-response.json -w 'direct_python_status=%{http_code}\n' -X POST http://127.0.0.1:18000/api/v1/ai/analyze/TCS -H 'Content-Type: application/json' -H "X-Atlas-Service-Token: $INTERNAL_SERVICE_TOKEN" --data-binary '{"symbol":"TCS","market":"NSE"}'
          cat /tmp/atlas-direct-response.json
      - name: Verify real cross-service HTTP boundary and JWT gates
        working-directory: backend/trading-core
        env:
          ATLAS_BRIDGE_CAPTURE_FILE: ${{ runner.temp }}/ai-bridge-capture.json
        run: mvn -B -ntp -Dtest=AiBridgeHttpIntegrationTest test
